name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: org.ljyh.linn.json
          bundle: Linn.flatpak
          artifact-name: Linn-flatpak
          cache-key: flatpak-builder-${{ github.sha }}

  release:
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute SHA256 for PKGBUILD
        id: archive
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          SHA256=$(git archive --format=tar.gz --prefix="linn-${VERSION}/" "${TAG}" | sha256sum | cut -d' ' -f1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          # flatpak-builder@v6 appends the build architecture to artifact-name.
          name: Linn-x86_64.flatpak
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.archive.outputs.tag }}
          name: ${{ steps.archive.outputs.tag }}
          body: |
            ## Changelog

            ## SHA256 (for PKGBUILD)

            \`\`\`
            ${{ steps.archive.outputs.sha256 }}  linn-${{ steps.archive.outputs.version }}.tar.gz
            \`\`\`
          files: Linn.flatpak
